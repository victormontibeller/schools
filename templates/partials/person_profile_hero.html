<div class="sm-profile-hero d-flex flex-column flex-sm-row align-items-center text-center text-sm-start gap-3 pb-4 mb-4 border-bottom">
    {% if profile_avatar_field %}<div class="sm-profile-avatar-picker flex-shrink-0">
        <label for="{{ profile_avatar_field.id_for_label }}" class="sm-profile-avatar-edit mb-0">
            {% endif %}{% if profile_has_image %}
            <img src="{{ profile_image_url }}" alt="Foto de {{ profile_name }}" class="sm-profile-avatar flex-shrink-0">
            {% else %}
            <div class="avatar-text avatar-xl {{ profile_avatar_theme }} flex-shrink-0" style="width:72px;height:72px;font-size:1.75rem">
                {{ profile_initial|default:"?"|first|upper }}
            </div>
            {% endif %}{% if profile_avatar_field %}
            <span class="visually-hidden">Alterar foto de {{ profile_name }}</span>
        </label>
        {{ profile_avatar_field }}
        {% for error in profile_avatar_field.errors %}
        <div class="invalid-feedback d-block text-center mt-2">{{ error }}</div>
        {% endfor %}
    </div>{% endif %}
    <div class="min-w-0">
        <h5 class="mb-1">{{ profile_name }}</h5>
        <p class="text-muted {% if profile_identifier %}mb-2{% else %}mb-0{% endif %} text-break">{{ profile_email|default:"—" }}</p>
        {% if profile_identifier %}
        <span class="badge bg-soft-secondary text-secondary">{{ profile_identifier_label }} {{ profile_identifier }}</span>
        {% endif %}
    </div>
</div>
